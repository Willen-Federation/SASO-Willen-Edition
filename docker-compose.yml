# =============================================================================
# SASO — local development stack (Colima / Docker Desktop compatible)
# -----------------------------------------------------------------------------
# Quick start (see Makefile for friendlier commands):
#   docker compose up -d              # app + db + adminer
#   docker compose --profile sso up   # adds Keycloak for OIDC / SAML testing
#
# Apple Silicon: `platform: linux/amd64` is set explicitly so MariaDB and
# Keycloak run under qemu when no native arm64 image is available — this
# matches the deployment surface most operators target. Removing the platform
# pin will drop those images on Apple Silicon hosts.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: saso/app:dev
    container_name: saso-app
    platform: linux/amd64
    ports:
      - "8080:80"
    volumes:
      # Bind-mount the project so edits are picked up without rebuilding.
      # The source lives at /var/www/html/saso/ to match `programDir: /saso/`
      # in config.json — the app's file-path resolver concatenates
      # documentRoot + programDir, so the on-disk layout has to match.
      # Apache's DocumentRoot is also set to /var/www/html/saso so the URL
      # root still serves index.php (see docker/apache/000-default.conf).
      # `:cached` is a macOS-only hint that improves bind-mount throughput;
      # ignored on Linux hosts.
      - ./:/var/www/html/saso:cached
      - composer-cache:/root/.composer/cache
    environment:
      # All values are sourced from the project-level `.env` file. `make up`
      # auto-generates that file with secure random values for APP_KEY /
      # DB_PASSWORD / MARIADB_ROOT_PASSWORD on first run; the entrypoint
      # script inside the container also regenerates them if the file is
      # missing on subsequent boots.
      #
      # The `${VAR:?msg}` form fails Compose with a clear message when the
      # variable is unset — no leaked dev secret can ever fall back as a
      # default for APP_KEY or DB_PASSWORD.
      #
      # AI / Auth0 credentials are stored encrypted in the `system_setting`
      # DB table and configured via the admin Web UI (/admin/ai-settings,
      # /admin/auth-providers). The variables passed through below are
      # optional developer overrides used when no DB row exists yet.
      DB_DSN: "mysql:host=db;dbname=saso_db;charset=utf8mb4"
      DB_USER: "${DB_USER:-saso_user}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env, or run \"make up\" to auto-generate}"
      APP_HTTPS: "${APP_HTTPS:-false}"
      APP_KEY: "${APP_KEY:?set APP_KEY in .env, or run \"make up\" to auto-generate}"
      AI_PROVIDER: "${AI_PROVIDER:-}"
      LOCAL_GEMINI_KEY: "${LOCAL_GEMINI_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:-}"
      AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID:-}"
      AUTH0_CLIENT_SECRET: "${AUTH0_CLIENT_SECRET:-}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - saso

  db:
    image: mariadb:10.6
    container_name: saso-db
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env, or run \"make up\" to auto-generate}"
      MARIADB_DATABASE: saso_db
      MARIADB_USER: "${DB_USER:-saso_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env, or run \"make up\" to auto-generate}"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - saso

  adminer:
    image: adminer:4
    container_name: saso-adminer
    platform: linux/amd64
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette
    depends_on:
      db:
        condition: service_started
    networks:
      - saso

  # Optional OIDC / SAML test IdP. Enabled with `--profile sso`:
  #     docker compose --profile sso up -d
  # The default admin credentials are admin / admin and the dev mode disables
  # the production-readiness checks. Do NOT expose this port outside localhost.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: saso-keycloak
    platform: linux/amd64
    profiles:
      - sso
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: saso-keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8082:8080"
    networks:
      - saso

volumes:
  db-data:
  composer-cache:

networks:
  saso:
    driver: bridge
