name: Docs

# Documentation hosting moved to Netlify (https://saso-willen-edition.netlify.app);
# Netlify owns deploy previews and production rollouts via its GitHub App. This
# workflow stays as a redundant CI gate so a `mkdocs build --strict` failure is
# visible on the PR even if the Netlify check is delayed.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'netlify.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'netlify.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mkdocs-git-revision-date-localized needs full history

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site (strict — fails on warnings, missing references, broken in-tree links)
        run: mkdocs build --strict
