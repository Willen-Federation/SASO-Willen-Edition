<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName localhost
    # DocumentRoot points at /var/www/html/saso so the URL root maps to the
    # project's index.php while config.json's `programDir: /saso/` continues to
    # describe the on-disk layout the file-path resolver depends on.
    DocumentRoot /var/www/html/saso

    <Directory /var/www/html/saso>
        Options -Indexes +FollowSymLinks
        # AllowOverride All so the project's .htaccess (mod_rewrite, security
        # headers, file-deny rules) is honored. This matches typical shared-
        # hosting configurations.
        AllowOverride All
        Require all granted
    </Directory>

    # The framework emits `<base href=".../saso/">` and other URLs that are
    # prefixed with `programDir` from config.json (default `/saso/`). Alias
    # that prefix back to the same DocumentRoot so the prefixed URLs resolve
    # to the same files as the un-prefixed ones — otherwise the .htaccess
    # rewrite catches them and serves index.php in place of CSS / JS / images.
    Alias /saso /var/www/html/saso

    # Stream logs to the container's stdout/stderr so `docker compose logs` works.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
