# =============================================================================
# SASO REST API — OpenAPI 3.1 specification
# -----------------------------------------------------------------------------
# This file is the **single source of truth** for the `/api/v1/*` surface
# (cf. ADR 0002). The application's router boots from it: every path × method
# entry must carry an `x-handler` extension naming a callable in PHP, and no
# code path serves an endpoint that is not declared here.
#
# Conventions:
#   * `operationId` is the unique handler key the router uses to wire requests
#     to PHP callables. Treat it as a stable contract for SDK generators.
#   * Error responses always reference `#/components/responses/Problem*` so the
#     RFC 7807 shape (with the SASO `code` + `traceId` extensions) stays
#     uniform across the API.
#   * Schemas under `components/schemas/` are reusable. Do not inline the
#     ProblemDetails shape — clients should be able to deserialize it from a
#     single named schema.
# =============================================================================

openapi: 3.1.0

info:
  title: SASO REST API
  version: 1.0.0-alpha
  summary: Inventory and warehouse operations over HTTP.
  description: |
    REST surface for the SASO inventory and warehouse management system.
    Errors follow [RFC 7807 Problem Details](https://datatracker.ietf.org/doc/html/rfc7807)
    with the SASO `code` and `traceId` vendor extensions. See the
    [error codes catalogue](https://docs.willen-federation.org/error-codes)
    for the full identifier list.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
  contact:
    name: Willen Federation contributors
    url: https://github.com/Willen-Federation/SASO-Willen-Edition

servers:
  - url: /api/v1
    description: This SASO instance.

tags:
  - name: meta
    description: Service health, build info, and the API specification itself.
  - name: auth
    description: Authentication provider discovery (public — no credentials required).
  - name: feature-flags
    description: Operator-managed runtime feature flags (cf. ADR 0005).
  - name: mobile
    description: QR-based device pairing and Flutter client configuration.
  - name: items
    description: Inventory item CRUD operations (Bearer auth).
  - name: categories
    description: Category hierarchy (Bearer auth).
  - name: storage-locations
    description: Storage location hierarchy and item contents (Bearer auth).
  - name: barcodes
    description: Barcode lookup (Bearer auth).

paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness probe.
      description: |
        Returns a small JSON document indicating the service is reachable. Used
        by orchestrators (Kubernetes liveness, ELB target health) and by
        operators verifying a deployment.

        This endpoint deliberately does **not** check downstream dependencies
        (database, IdP, file storage). A `200 OK` here only means "PHP is
        running"; deeper diagnostics live behind `/health/readiness`
        (introduced in M4).
      operationId: getHealth
      x-handler: 'Saso\Presentation\Api\V1\Controller\HealthController::handle'
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /openapi.yaml:
    get:
      tags: [meta]
      summary: Returns this OpenAPI specification.
      description: |
        Serves this exact YAML document. Useful for SDK generators, contract
        tests, and Swagger UI.
      operationId: getOpenApiSpec
      x-handler: 'Saso\Presentation\Api\V1\Controller\OpenApiController::yaml'
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags: [meta]
      summary: Swagger UI for this specification.
      description: |
        Renders an embedded Swagger UI that loads `/api/v1/openapi.yaml`.
        Operators get a "try it out" surface without leaving the
        application's origin.
      operationId: getSwaggerUi
      x-handler: 'Saso\Presentation\Api\V1\Controller\SwaggerUiController::page'
      responses:
        '200':
          description: HTML page with Swagger UI bootstrap.
          content:
            text/html:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # Feature Flags
  # ---------------------------------------------------------------------------

  /feature-flags:
    get:
      tags: [feature-flags]
      summary: List all feature flags.
      description: |
        Returns every feature flag ordered by key. No pagination — the full
        list is also available in the Flutter config bundle at
        `GET /api/v1/mobile/config`.
      operationId: listFeatureFlags
      x-handler: 'Saso\Presentation\Api\V1\Controller\FeatureFlag\FeatureFlagListController::handle'
      responses:
        '200':
          description: Feature flag list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagList'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

    post:
      tags: [feature-flags]
      summary: Create a feature flag.
      description: |
        Creates a new operator-managed feature flag. `key` must be unique and
        match `^[a-z0-9][a-z0-9._]{0,119}$`.
      operationId: createFeatureFlag
      x-handler: 'Saso\Presentation\Api\V1\Controller\FeatureFlag\FeatureFlagCreateController::handle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagCreateRequest'
      responses:
        '201':
          description: Feature flag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResource'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The feature flag key (e.g. `checkout.new_flow`).
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9._]{0,119}$'

    get:
      tags: [feature-flags]
      summary: Get a feature flag.
      operationId: getFeatureFlag
      x-handler: 'Saso\Presentation\Api\V1\Controller\FeatureFlag\FeatureFlagGetController::handle'
      responses:
        '200':
          description: Feature flag found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResource'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

    patch:
      tags: [feature-flags]
      summary: Partially update a feature flag.
      description: |
        Only the fields present in the request body are applied. This allows
        toggling `enabled` or changing `rolloutPercent` without resending the
        full object.
      operationId: updateFeatureFlag
      x-handler: 'Saso\Presentation\Api\V1\Controller\FeatureFlag\FeatureFlagUpdateController::handle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagPatchRequest'
      responses:
        '200':
          description: Feature flag updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResource'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

    delete:
      tags: [feature-flags]
      summary: Delete a feature flag.
      description: |
        Hard-deletes the feature flag. Flutter devices will no longer receive
        this flag in the config bundle after their next poll.
      operationId: deleteFeatureFlag
      x-handler: 'Saso\Presentation\Api\V1\Controller\FeatureFlag\FeatureFlagDeleteController::handle'
      responses:
        '204':
          description: Feature flag deleted.
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ---------------------------------------------------------------------------
  # Mobile / QR connection
  # ---------------------------------------------------------------------------

  /mobile/pairing-codes:
    post:
      tags: [mobile]
      summary: Generate a QR pairing code.
      description: |
        Generates a short-lived (10 min) one-time pairing token and returns it
        as a QR code image (base64 PNG data URI) and the raw QR payload string.

        **QR payload format (proprietary — app-only readable):**

        ```
        SASO1:<base64url_token>|<server_base_url>
        ```

        The `SASO1:` prefix is a magic marker recognised exclusively by the SASO
        Flutter app. A generic QR scanner displays opaque text with no actionable
        link, preventing accidental OS-level deep-link interception.

        The Flutter app detects the prefix, extracts the token and server URL,
        then automatically calls `POST /api/v1/mobile/connect` — no user
        interaction beyond pointing the camera at the QR code.
      operationId: createPairingCode
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\QrController::handle'
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
      responses:
        '201':
          description: Pairing code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /mobile/connect:
    post:
      tags: [mobile]
      summary: Exchange a pairing code for a JWT token pair.
      description: |
        The Flutter app calls this automatically after scanning the QR and
        detecting the `SASO1:` prefix. On success the pairing code is consumed
        (single use) and an OAuth2-style token pair is returned:

        - `access_token` — HS256 JWT, valid 1 hour, use as `Authorization: Bearer`
        - `refresh_token` — opaque long-lived token (1 year), use to renew the JWT
          via `POST /api/v1/mobile/token/refresh`

        Store both tokens securely (Flutter secure_storage or equivalent). The
        refresh token is rotated on every refresh call.
      operationId: mobileConnect
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\ConnectController::handle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
      responses:
        '201':
          description: JWT token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /mobile/token/refresh:
    post:
      tags: [mobile]
      summary: Refresh the JWT access token.
      description: |
        Exchanges a valid refresh token for a new JWT access token and a
        rotated refresh token. The old refresh token is invalidated immediately
        — the app MUST persist the new `refresh_token` and discard the old one.

        Replaying an old refresh token returns `404 SASO-MOBILE-2004`.
      operationId: refreshMobileToken
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\TokenRefreshController::handle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: New JWT token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /mobile/config:
    get:
      tags: [mobile]
      summary: Download the Flutter configuration bundle.
      description: |
        Returns a versioned JSON bundle containing all feature flags.
        Flutter devices download this bundle on startup (and periodically)
        and cache it locally so feature flags can be evaluated without a
        server round-trip.

        The `version` field is a SHA-256 digest of the flag payload.
        Devices SHOULD compare `version` against their cached value and
        skip applying the bundle if it has not changed.

        **Auth:** `Authorization: Bearer <deviceToken>` (issued by
        `POST /api/v1/mobile/connect`).
      operationId: getMobileConfig
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\ConfigBundleController::handle'
      security:
        - deviceJwt: []
      responses:
        '200':
          description: Configuration bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileConfigBundle'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /mobile/tokens:
    get:
      tags: [mobile]
      summary: List all device tokens.
      description: |
        Returns all issued device tokens (active, revoked, and expired) for
        admin audit and token-management purposes.
      operationId: listDeviceTokens
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\TokenListController::handle'
      security:
        - adminSession: []
      responses:
        '200':
          description: Device token list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenList'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /mobile/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric device token ID.
        schema:
          type: integer
          minimum: 1

    delete:
      tags: [mobile]
      summary: Revoke a device token.
      description: |
        Soft-revokes the token by setting `revoked = true`. The device will
        receive `SASO-MOBILE-2005` on its next authenticated request.
      operationId: revokeDeviceToken
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\TokenRevokeController::handle'
      security:
        - adminSession: []
      responses:
        '204':
          description: Token revoked.
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ---------------------------------------------------------------------------
  # Auth provider discovery
  # ---------------------------------------------------------------------------

  /auth/providers:
    get:
      tags: [auth]
      summary: Discover available authentication providers.
      description: |
        Public endpoint the Flutter app calls immediately after the user enters
        a server URL. Returns the list of enabled IdP providers and the
        recommended `authStrategy` so the app can skip the chooser when only
        one provider is configured.

        No credentials required.
      operationId: listAuthProviders
      x-handler: 'Saso\Presentation\Api\V1\Controller\Mobile\DiscoveryController::handle'
      responses:
        '200':
          description: Auth provider discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviderDiscovery'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ---------------------------------------------------------------------------
  # Barcodes
  # ---------------------------------------------------------------------------

  /barcode/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: JAN / EAN barcode string.
        schema:
          type: string
          minLength: 1

    get:
      tags: [barcodes]
      summary: Look up a barcode.
      description: |
        Finds a registered barcode and returns its status and, if linked, a
        brief summary of the associated inventory item.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: getBarcode
      x-handler: 'Saso\Presentation\Api\V1\Controller\Barcode\BarcodeGetController::handle'
      responses:
        '200':
          description: Barcode found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeResource'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ---------------------------------------------------------------------------
  # Items
  # ---------------------------------------------------------------------------

  /items:
    get:
      tags: [items]
      summary: List / search inventory items.
      description: |
        Returns a cursor-paginated list of items. Supports keyword search,
        category filter, and exact barcode match.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: listItems
      x-handler: 'Saso\Presentation\Api\V1\Controller\Item\ListItemsController::handle'
      parameters:
        - name: q
          in: query
          description: Keyword search (LIKE match on name and JAN code).
          schema:
            type: string
        - name: category_id
          in: query
          description: Filter by category ID.
          schema:
            type: integer
            minimum: 1
        - name: barcode
          in: query
          description: Exact JAN / EAN code match.
          schema:
            type: string
        - name: isbn
          in: query
          description: Exact ISBN-13 code match.
          schema:
            type: string
        - name: label_code
          in: query
          description: Exact custom label/shelf code match.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (1–200, default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: cursor
          in: query
          description: Last item ID from the previous page (cursor pagination).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Item list with cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

    post:
      tags: [items]
      summary: Create an inventory item.
      description: |
        Creates a new item in the specified category. Supply an
        `Idempotency-Key` header to make retries safe.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: createItem
      x-handler: 'Saso\Presentation\Api\V1\Controller\Item\CreateItemController::handle'
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID for safe retries (24 h TTL).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '201':
          description: Item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResource'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric item ID.
        schema:
          type: integer
          minimum: 1

    get:
      tags: [items]
      summary: Get a single inventory item.
      description: |
        Returns full item detail including EAV attribute values.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: getItem
      x-handler: 'Saso\Presentation\Api\V1\Controller\Item\GetItemController::handle'
      responses:
        '200':
          description: Item found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResource'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

    patch:
      tags: [items]
      summary: Partially update an inventory item.
      description: |
        Only the fields present in the request body are applied. Supply an
        `Idempotency-Key` header for safe retries.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: updateItem
      x-handler: 'Saso\Presentation\Api\V1\Controller\Item\UpdateItemController::handle'
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated UUID for safe retries (24 h TTL).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatchRequest'
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResource'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /items/drafts:
    post:
      tags: [items]
      summary: Upload an image to create an item draft.
      description: |
        Accepts a multipart upload (one product photo plus optional barcode /
        name / price hints) and enqueues an `item_draft` row. A background
        worker enriches the draft via barcode lookup and AI vision before
        promoting it to a real item, so this endpoint returns immediately
        with the draft id and `status: queued`.

        **Auth:** `Authorization: Bearer <deviceToken>` (`items:write` scope)
      operationId: createItemDraft
      x-handler: 'Saso\Presentation\Api\V1\Controller\Item\DraftCreateController::handle'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Product photo (jpeg/png/webp/gif, ≤ 20 MB).
                item_name:
                  type: string
                  description: Optional initial name hint.
                jan_code:
                  type: string
                  description: Optional JAN/EAN barcode string.
                isbn:
                  type: string
                  description: Optional ISBN.
                price:
                  type: string
                  description: Optional price hint.
                barcode_hint:
                  type: string
                  description: Optional barcode string to associate.
      responses:
        '201':
          description: Draft accepted; background processing queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDraftResource'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ---------------------------------------------------------------------------
  # Categories
  # ---------------------------------------------------------------------------

  /categories:
    get:
      tags: [categories]
      summary: List the category hierarchy.
      description: |
        Returns all categories as a flat list (default) or a nested tree.
        Use `format=tree` to receive each root category with its `children`
        populated recursively.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: listCategories
      x-handler: 'Saso\Presentation\Api\V1\Controller\Category\ListCategoriesController::handle'
      parameters:
        - name: format
          in: query
          description: Response shape — flat list or recursive tree.
          schema:
            type: string
            enum: [flat, tree]
            default: flat
      responses:
        '200':
          description: Category list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  # ---------------------------------------------------------------------------
  # Storage Locations
  # ---------------------------------------------------------------------------

  /storage-locations:
    get:
      tags: [storage-locations]
      summary: List storage locations.
      description: |
        Returns root storage locations when `parent_id` is omitted, or the
        direct children of the specified location.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: listStorageLocations
      x-handler: 'Saso\Presentation\Api\V1\Controller\StorageLocation\ListStorageLocationsController::handle'
      parameters:
        - name: parent_id
          in: query
          description: Return children of this location (omit for roots).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Storage location list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationList'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /storage-locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric storage location ID.
        schema:
          type: integer
          minimum: 1

    get:
      tags: [storage-locations]
      summary: Get a storage location.
      description: |
        Returns a single storage location with capacity, operational status,
        and whether it can receive or ship inventory.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: getStorageLocation
      x-handler: 'Saso\Presentation\Api\V1\Controller\StorageLocation\GetStorageLocationController::handle'
      responses:
        '200':
          description: Storage location found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResource'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

  /storage-locations/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric storage location ID.
        schema:
          type: integer
          minimum: 1

    get:
      tags: [storage-locations]
      summary: List items in a storage location.
      description: |
        Returns items currently assigned to the specified storage location.

        **Auth:** `Authorization: Bearer <deviceToken>`
      operationId: listStorageLocationItems
      x-handler: 'Saso\Presentation\Api\V1\Controller\StorageLocation\StorageLocationItemsController::handle'
      parameters:
        - name: limit
          in: query
          description: Page size (1–200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Items in this location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '500':
          $ref: '#/components/responses/ProblemInternalError'

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok` when the response is a 200.
          example: ok
        version:
          type: string
          description: API contract version. Follows SemVer.
          example: 1.0.0-alpha
        time:
          type: string
          format: date-time
          description: Server time at response generation, UTC, RFC 3339.
          example: '2026-04-26T12:34:56Z'

    # -------------------------------------------------------------------------
    # Feature Flags
    # -------------------------------------------------------------------------

    FeatureFlagResource:
      type: object
      required: [id, key, description, enabled, rolloutPercent, errorThreshold, errorWindowMinutes, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        key:
          type: string
          example: checkout.new_flow
        description:
          type: string
          example: Enables the redesigned checkout flow.
        enabled:
          type: boolean
          example: false
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 0
        conditions:
          type: object
          nullable: true
          description: Targeting rules evaluated by the OpenFeature provider.
          example: null
        errorThreshold:
          type: integer
          minimum: 0
          example: 0
        errorWindowMinutes:
          type: integer
          minimum: 1
          example: 60
        autoDisabledAt:
          type: string
          format: date-time
          nullable: true
          example: null
        autoDisableReason:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-04-26T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-04-26T12:00:00Z'

    FeatureFlagList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagResource'
        total:
          type: integer
          example: 3

    FeatureFlagCreateRequest:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
          pattern: '^[a-z0-9][a-z0-9._]{0,119}$'
          example: checkout.new_flow
        description:
          type: string
          maxLength: 500
          example: Enables the redesigned checkout flow.
        enabled:
          type: boolean
          default: false
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        conditions:
          type: object
          nullable: true
        errorThreshold:
          type: integer
          minimum: 0
          default: 0
        errorWindowMinutes:
          type: integer
          minimum: 1
          default: 60

    FeatureFlagPatchRequest:
      type: object
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 500
        enabled:
          type: boolean
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
        conditions:
          type: object
          nullable: true
        errorThreshold:
          type: integer
          minimum: 0
        errorWindowMinutes:
          type: integer
          minimum: 1

    # -------------------------------------------------------------------------
    # Mobile / QR connection
    # -------------------------------------------------------------------------

    PairingCodeRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 200
          description: Human-readable name for this pairing session.
          example: iPad mini (stock room)
        url:
          type: string
          format: uri
          description: |
            Override the server URL embedded in the QR code. Useful when the
            server is behind a reverse proxy with a different public hostname.
          example: https://saso.example.com

    PairingCodeResponse:
      type: object
      required: [label, qrPayload, qrDataUri, expiresAt]
      properties:
        label:
          type: string
          example: iPad mini (stock room)
        qrPayload:
          type: string
          description: |
            The raw string encoded in the QR image. Format:
            `SASO1:<base64url_token>|<server_url>`
            The Flutter app parses this string directly; a generic QR
            scanner displays opaque text with no actionable link.
          example: 'SASO1:dGhpcyBpcyBhIHRlc3Q|https://saso.example.com'
        qrDataUri:
          type: string
          description: PNG QR code as a `data:image/png;base64,…` data URI.
          example: 'data:image/png;base64,iVBORw0KGgo...'
        expiresAt:
          type: string
          format: date-time
          description: UTC expiry of the pairing code (10 minutes from creation).
          example: '2026-04-26T12:10:00Z'

    ConnectRequest:
      type: object
      required: [token, deviceName]
      properties:
        token:
          type: string
          description: |
            Raw token extracted from the QR payload (the segment between
            `SASO1:` and `|`).
          example: dGhpcyBpcyBhIHRlc3Q
        deviceName:
          type: string
          maxLength: 200
          description: Human-readable name the Flutter app supplies for this device.
          example: iPad mini

    TokenRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token from POST /mobile/connect or the previous refresh.
          example: X9kL2mNpQ3rS4tU5vW6x

    TokenPairResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, device_id, expires_at]
      description: OAuth2-style token response (RFC 6749 §5.1).
      properties:
        access_token:
          type: string
          description: |
            HS256 JWT access token (valid for `expires_in` seconds).
            Include as `Authorization: Bearer <access_token>` on API calls.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds (3600 = 1 hour).
          example: 3600
        refresh_token:
          type: string
          description: |
            Long-lived opaque refresh token (valid ~1 year). Store securely
            and use to obtain a new access token via POST /mobile/token/refresh.
            **Rotated on every refresh** — discard the old token after each call.
          example: Y0zM3nOpQ4rT5uV6wX7y
        device_id:
          type: integer
          description: Numeric device record ID (use for admin revocation).
          example: 1
        device_name:
          type: string
          description: Device name as supplied during pairing.
          example: iPad mini
        expires_at:
          type: string
          format: date-time
          description: Access token expiry (RFC 3339).
          example: '2026-04-26T13:00:00Z'

    MobileConfigBundle:
      type: object
      required: [version, generatedAt, featureFlags]
      properties:
        version:
          type: string
          description: |
            SHA-256 digest of the feature-flag payload. Cache this value;
            re-apply the bundle only when it changes.
          example: a3f5c8d2e1b04796...
        generatedAt:
          type: string
          format: date-time
          example: '2026-04-26T12:00:00Z'
        featureFlags:
          type: array
          description: All feature flags for local offline evaluation.
          items:
            $ref: '#/components/schemas/MobileFeatureFlag'

    MobileFeatureFlag:
      type: object
      required: [key, enabled, rolloutPercent]
      properties:
        key:
          type: string
          example: checkout.new_flow
        enabled:
          type: boolean
          example: false
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 0
        conditions:
          type: object
          nullable: true
          example: null

    DeviceTokenResource:
      type: object
      required: [id, deviceName, revoked, expiresAt, createdAt]
      properties:
        id:
          type: integer
          example: 1
        deviceName:
          type: string
          example: iPad mini
        revoked:
          type: boolean
          example: false
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        expiresAt:
          type: string
          format: date-time
          example: '2027-04-26T12:00:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-04-26T12:00:00Z'

    DeviceTokenList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceTokenResource'
        total:
          type: integer
          example: 2

    # -------------------------------------------------------------------------
    # Auth discovery
    # -------------------------------------------------------------------------

    AuthProviderSummary:
      type: object
      required: [id, name, type, isDefault, enabled]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Corporate SSO
        type:
          type: string
          description: Provider type (oidc, saml, firebase, auth0, cognito, local).
          example: oidc
        isDefault:
          type: boolean
          example: true
        enabled:
          type: boolean
          example: true

    AuthProviderDiscovery:
      type: object
      required: [serverName, version, mobileSetupUrl, authStrategy, providers]
      properties:
        serverName:
          type: string
          example: SASO Warehouse
        version:
          type: string
          example: 1.0.0-alpha
        mobileSetupUrl:
          type: string
          format: uri
          description: URL to open the in-app browser for the pairing flow.
          example: https://saso.example.com/m/setup
        authStrategy:
          type: string
          enum: [local-only, default-only, user-choice]
          description: |
            How the Flutter app should present the login chooser:
            - `local-only` — no external IdPs configured; show username/password.
            - `default-only` — one IdP is marked default; skip the chooser.
            - `user-choice` — multiple IdPs; show a chooser screen.
          example: default-only
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AuthProviderSummary'

    # -------------------------------------------------------------------------
    # Barcodes
    # -------------------------------------------------------------------------

    BarcodeItemSummary:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: Acme Widget A

    BarcodeResource:
      type: object
      required: [code, status]
      properties:
        code:
          type: string
          description: The barcode string (JAN / EAN).
          example: '4901234567890'
        status:
          type: string
          description: Barcode registration status.
          example: active
        item:
          $ref: '#/components/schemas/BarcodeItemSummary'

    # -------------------------------------------------------------------------
    # Items
    # -------------------------------------------------------------------------

    AttributeValue:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
          example: color
        label:
          type: string
          example: 色
        value:
          nullable: true
          example: red

    ItemResource:
      type: object
      required: [id, name, categoryId, price, stock, status, features, registeredAt]
      properties:
        id:
          type: string
          example: '42'
        name:
          type: string
          example: Acme Widget A
        description:
          type: string
          nullable: true
          example: null
        categoryId:
          type: string
          example: '7'
        categoryName:
          type: string
          nullable: true
          example: Electronics
        janCode:
          type: string
          nullable: true
          example: '4901234567890'
        isbnCode:
          type: string
          nullable: true
          example: '9784101092058'
          description: ISBN-13 barcode (books only).
        labelCode:
          type: string
          nullable: true
          description: "Custom label/shelf code."
        price:
          type: integer
          minimum: 0
          example: 1500
        stock:
          type: integer
          minimum: 0
          example: 10
        status:
          type: string
          enum: [active, archived, discontinued, pending, in_storage, in_use, for_sale, reserved, shipped]
          example: active
        storageLocationId:
          type: string
          nullable: true
          example: '3'
        features:
          type: array
          items:
            type: object
          example: []
        attributes:
          type: array
          description: EAV attribute values (only present on GET /items/{id}).
          items:
            $ref: '#/components/schemas/AttributeValue'
        registeredAt:
          type: string
          format: date-time
          example: '2026-05-01T09:00:00Z'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-05-10T14:30:00Z'

    ItemList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemResource'
        total:
          type: integer
          description: Total matching rows (before cursor limit).
          example: 42
        nextCursor:
          type: integer
          nullable: true
          description: Pass as `cursor` on the next request to get the next page.
          example: 99

    ItemCreateRequest:
      type: object
      required: [name, categoryId]
      properties:
        name:
          type: string
          minLength: 1
          example: Acme Widget A
        categoryId:
          type: integer
          minimum: 1
          example: 7
        janCode:
          type: string
          example: '4901234567890'
        isbnCode:
          type: string
          example: '9784101092058'
          description: ISBN-13 barcode (books). Mutually exclusive with janCode.
        labelCode:
          type: string
          nullable: true
          description: "Custom label/shelf code."
        price:
          type: integer
          minimum: 0
          default: 0
          example: 1500
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 10

    ItemPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        categoryId:
          type: integer
          minimum: 1
        janCode:
          type: string
          nullable: true
        isbnCode:
          type: string
          nullable: true
          description: ISBN-13 barcode (books).
        labelCode:
          type: string
          nullable: true
          description: "Custom label/shelf code."
        price:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0

    ItemDraftResource:
      type: object
      required: [draft_id, status]
      properties:
        draft_id:
          type: integer
          minimum: 1
          example: 42
        status:
          type: string
          enum: [queued, processing, ready, failed]
          example: queued

    # -------------------------------------------------------------------------
    # Categories
    # -------------------------------------------------------------------------

    CategoryResource:
      type: object
      required: [id, name, nameEn, nameJa, depth, sortOrder, code, children]
      properties:
        id:
          type: string
          example: '3'
        name:
          type: string
          description: Display name (Japanese preferred, falls back to English).
          example: 電子機器
        nameEn:
          type: string
          example: Electronics
        nameJa:
          type: string
          example: 電子機器
        parentId:
          type: string
          nullable: true
          example: null
        depth:
          type: integer
          example: 0
        sortOrder:
          type: integer
          example: 1
        code:
          type: string
          example: ELEC
        children:
          type: array
          description: Populated only when `format=tree`.
          items:
            $ref: '#/components/schemas/CategoryResource'

    CategoryList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResource'
        total:
          type: integer
          example: 12

    # -------------------------------------------------------------------------
    # Storage Locations
    # -------------------------------------------------------------------------

    StorageLocationResource:
      type: object
      required: [id, code, name, label, location, locationType, depth, position, operationalStatus, canReceive, canShip]
      properties:
        id:
          type: string
          example: '5'
        parentId:
          type: string
          nullable: true
          example: null
        code:
          type: string
          example: A-01-03
        name:
          type: string
          example: Aisle 1, Shelf 3
        label:
          type: string
          example: Aisle 1, Shelf 3
        location:
          type: string
          example: A-01-03
        locationType:
          type: string
          example: shelf
        depth:
          type: integer
          example: 2
        position:
          type: integer
          example: 3
        operationalStatus:
          type: string
          example: active
        canReceive:
          type: boolean
          example: true
        canShip:
          type: boolean
          example: true
        capacity:
          type: integer
          nullable: true
          example: 100
        description:
          type: string
          nullable: true
          example: null
        itemIds:
          type: array
          description: Populated only on GET /storage-locations/{id}.
          items:
            type: integer

    StorageLocationList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageLocationResource'
        total:
          type: integer
          example: 8

    # -------------------------------------------------------------------------
    # Errors (RFC 7807)
    # -------------------------------------------------------------------------

    ProblemDetails:
      type: object
      description: |
        RFC 7807 Problem Details with the SASO vendor extensions `code` and
        `traceId`. Clients should branch on `code`; `title` and `detail` are
        localised strings whose wording may change between releases.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: Canonical URL for the error code.
          example: https://docs.willen-federation.org/error-codes#SASO-AUTH-1001
        title:
          type: string
          description: Short, human-readable summary.
          example: Invalid credentials
        status:
          type: integer
          description: Mirrors the HTTP status of the response.
          example: 401
        detail:
          type: string
          description: Request-specific message, localised.
          example: The submitted credentials did not match an active account.
        instance:
          type: string
          description: Request URI (no query string).
          example: /api/v1/auth/login
        code:
          type: string
          pattern: '^SASO-[A-Z]+-\d{4}$'
          description: Stable SASO error identifier.
          example: SASO-AUTH-1001
        traceId:
          type: string
          format: uuid
          description: UUIDv4 unique per request, present in the server log.
          example: 1f9b3c8a-9e15-4d6a-8c2c-3d8f4f1f7a12

  responses:
    ProblemUnauthorized:
      description: Authentication is required or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemForbidden:
      description: Authenticated, but not allowed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemBadRequest:
      description: The request body is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemNotFound:
      description: No matching endpoint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemMethodNotAllowed:
      description: HTTP method not registered on this path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemInternalError:
      description: Unexpected server-side failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: |
        Cookie-based session for the admin web UI. Endpoints tagged with
        this scheme require the caller to have signed in through the
        password / external-IdP flow (`$_SESSION['id']` populated).
    deviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived HS256 JWT issued by `POST /api/v1/mobile/connect` (or
        rotated via `POST /api/v1/mobile/token/refresh`). The `sub` claim
        is the `device_token.id`; the SASO-specific `mid` claim binds the
        token to the admin Member who minted it, and `scp` lists the
        scopes granted at issuance time.
