; ============================================================================
; SASO — development PHP overrides (mounted at /usr/local/etc/php/conf.d/zz-*)
; ----------------------------------------------------------------------------
; These values are tuned for an interactive dev loop. Production deployments
; should ship their own conf.d snippet with display_errors=Off, opcache
; revalidation tightened, and an upload_max_filesize that matches their
; reverse-proxy limits.
; ============================================================================

[PHP]
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
date.timezone = UTC

; --- Session hardening ------------------------------------------------------
; The application also sets these via session_set_cookie_params() at runtime
; (M1-B). The php.ini values below are belt-and-braces for environments
; where the Apache request reaches a handler that runs before our
; index.php — they keep the defaults safe even if some future entry point
; misses the runtime call.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

; --- OPcache ----------------------------------------------------------------
; validate_timestamps=1 + revalidate_freq=0 means every request re-stats
; the source files. Slightly slower than a long revalidate but matches the
; "edit a file, refresh the browser" expectation for development.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
