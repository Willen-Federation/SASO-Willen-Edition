# =============================================================================
# English (en) — default locale.
# =============================================================================
# This catalogue is the source of truth for user-facing strings the application
# emits. The Japanese translation lives in `ja.yaml`; new locales are added by
# dropping a sibling `<locale>.yaml` file with the same key tree.
#
# Conventions:
#   - Error keys mirror the SASO error-code catalogue exactly:
#     `error.<full-code>.title|detail` (cf. ADR 0004).
#   - Detail strings are user-facing; never include stack-trace context, IDs,
#     or anything that would not survive a screenshot in a support ticket.
#   - Placeholders use Symfony's brace syntax: `{name}`.
# =============================================================================

error:
  SASO-AUTH-1001:
    title: Invalid credentials
    detail: The submitted credentials did not match an active account.
  SASO-AUTH-1002:
    title: Session expired
    detail: Your session has expired. Please sign in again.
  SASO-AUTH-1003:
    title: CSRF token mismatch
    detail: The submitted CSRF token did not validate. Refresh the page and try again.
  SASO-AUTH-1004:
    title: Authentication required
    detail: This endpoint requires an authenticated user.
  SASO-AUTH-1005:
    title: Access denied
    detail: You do not have permission to perform this action.
  SASO-AUTH-1006:
    title: Authentication provider is misconfigured
    detail: 'This authentication provider is currently unavailable. Please ask an administrator to verify the configuration.'
  SASO-AUTH-1007:
    title: Authentication callback could not be matched to a pending request
    detail: 'The sign-in attempt timed out or could not be matched to a pending request. Please try again.'
  SASO-AUTH-1008:
    title: Authentication callback failed verification
    detail: 'The sign-in response from the identity provider failed verification. Please try again or contact an administrator.'
  SASO-CONFIG-6001:
    title: System setting not found
    detail: 'The requested system setting does not exist. Ask an administrator to verify the key spelling or to seed a default value.'
  SASO-FLAG-7001:
    title: Feature flag not found
    detail: 'The requested feature flag is not registered. Ask an administrator to add the flag or to remove the call site.'
  SASO-AI-8001:
    title: AI provider is not configured
    detail: 'The AI feature is currently unavailable. Ask an administrator to register an API key for the chosen provider.'
  SASO-AI-8002:
    title: AI provider rate-limited the request
    detail: 'The AI provider declined the request because the per-minute quota is exhausted. Try again in a moment.'
  SASO-AI-8003:
    title: AI provider returned a malformed response
    detail: 'The AI provider returned content that could not be parsed. The full response is in the server log.'
  SASO-AI-8004:
    title: AI prompt exceeds the provider context window
    detail: 'The submitted content is too large for the configured AI model. Reduce the input size or pick a model with a larger context window.'
  SASO-AI-8005:
    title: AI provider refused the request as policy-violating
    detail: 'The AI provider declined the request on safety grounds. Edit the prompt or content and try again.'
  SASO-PLUGIN-B001:
    title: Plugin attempted to register against a reserved core name
    detail: 'A plugin tried to register an extension under a name reserved for core SASO. Plugins must use vendor-prefixed names (e.g. "vendor:custom-llm").'
  SASO-INFRA-9000:
    title: Internal server error
    detail: 'An unexpected error occurred. Reference: {traceId}.'
  SASO-INFRA-9001:
    title: Database unavailable
    detail: The database is currently unreachable. Please try again in a moment.
  SASO-INFRA-9002:
    title: Storage unavailable
    detail: A required storage path is currently unreachable.
  SASO-INFRA-9003:
    title: Endpoint not found
    detail: 'The requested endpoint does not exist.'
  SASO-INFRA-9004:
    title: Method not allowed
    detail: 'The requested HTTP method is not supported on this endpoint.'
