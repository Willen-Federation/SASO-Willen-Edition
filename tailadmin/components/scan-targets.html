<!--
  Tailwind JIT scan target. Tailwind only generates utility classes that
  appear in `content` files. PHP templates emit most classes, but the
  components below use a few one-off variants (animation states, dynamic
  variants from Alpine `:class` expressions) that the JIT scanner cannot
  follow into PHP. Listing them once here keeps them in the build.
-->
<div class="hidden lg:block lg:translate-x-0 lg:hidden lg:w-[290px] lg:w-[90px]"></div>
<div class="-translate-x-full translate-x-0"></div>
<div class="z-9999 z-99999"></div>
<div class="bg-white/[0.03] bg-white/[0.05] bg-white/[0.06] bg-white/[0.10] bg-white/[0.12]"></div>
<div class="text-white/90 text-white/80"></div>
<div class="bg-brand-500/[0.12] bg-brand-500/15 bg-success-500/15 bg-warning-500/15 bg-error-500/15"></div>
<div class="dark:bg-blue-light-950 dark:bg-success-950 dark:bg-warning-950 dark:bg-error-950"></div>
<div class="dark:text-blue-light-100 dark:text-success-100 dark:text-warning-100 dark:text-error-100"></div>
<div class="dark:text-success-400 dark:text-warning-400 dark:text-error-400 dark:text-brand-400"></div>
<div class="ring-brand-500/20 ring-error-500/20"></div>
<div class="aria-invalid:border-error-500 aria-invalid:focus:ring-error-500/20"></div>
<div class="lg:static lg:translate-x-0 lg:w-[290px]"></div>
<div class="grid-cols-1 grid-cols-2 grid-cols-3 grid-cols-4 md:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 lg:grid-cols-4"></div>
