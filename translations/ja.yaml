# =============================================================================
# 日本語 (ja) — translation catalogue.
# =============================================================================
"...": "…"
# Mirrors the key tree in `en.yaml`. Missing keys here automatically fall back
# to English at request time (see TranslatorFactory's fallback locale chain).
#
# Style notes:
#   - 「丁寧体（です・ます調）」for user-facing strings.
#   - 専門用語（CSRF, セッション 等）は無理に和訳せず英字のまま使う。
#   - traceId など可変値は {traceId} のプレースホルダで埋め込む。
# =============================================================================

error:
  SASO-AUTH-1001:
    title: 認証情報が正しくありません
    detail: 入力された認証情報は有効なアカウントと一致しません。
  SASO-AUTH-1002:
    title: セッションの有効期限が切れました
    detail: セッションの有効期限が切れました。再度サインインしてください。
  SASO-AUTH-1003:
    title: CSRF トークンが一致しません
    detail: 送信された CSRF トークンを検証できませんでした。ページを再読み込みしてからもう一度お試しください。
  SASO-AUTH-1004:
    title: 認証が必要です
    detail: このエンドポイントには認証されたユーザーが必要です。
  SASO-AUTH-1005:
    title: アクセスが拒否されました
    detail: この操作を実行する権限がありません。
  SASO-AUTH-1006:
    title: 認証プロバイダーが正しく設定されていません
    detail: この認証プロバイダーは現在利用できません。設定の確認を管理者にご依頼ください。
  SASO-AUTH-1007:
    title: 認証コールバックを保留中のリクエストと照合できませんでした
    detail: サインインの試行がタイムアウトしたか、保留中のリクエストと照合できませんでした。もう一度お試しください。
  SASO-AUTH-1008:
    title: 認証コールバックの検証に失敗しました
    detail: 認証プロバイダーからの応答を検証できませんでした。もう一度お試しいただくか、管理者にご連絡ください。
  SASO-CONFIG-6001:
    title: システム設定が見つかりません
    detail: 要求されたシステム設定は存在しません。キーのスペル確認、または既定値の登録を管理者にご依頼ください。
  SASO-FLAG-7001:
    title: 機能フラグが見つかりません
    detail: 要求された機能フラグは登録されていません。フラグの追加、または呼び出し元の削除を管理者にご依頼ください。
  SASO-AI-8001:
    title: AI プロバイダーが構成されていません
    detail: AI 機能は現在利用できません。選択中のプロバイダーの API キー登録を管理者にご依頼ください。
  SASO-AI-8002:
    title: AI プロバイダーのレート制限に達しました
    detail: AI プロバイダーが分当たりの上限に達したためリクエストを拒否しました。しばらく時間をおいて再度お試しください。
  SASO-AI-8003:
    title: AI プロバイダーの応答が不正です
    detail: AI プロバイダーが解析できない応答を返しました。完全な応答内容はサーバーログに記録されています。
  SASO-AI-8004:
    title: AI プロバイダーのコンテキスト長を超過しました
    detail: 送信内容が AI モデルの上限を超えています。入力を縮小するか、より大きなコンテキストを持つモデルをご利用ください。
  SASO-AI-8005:
    title: AI プロバイダーがリクエストを拒否しました（コンテンツポリシー違反）
    detail: AI プロバイダーが安全上の理由でリクエストを拒否しました。プロンプトや内容を見直してから再度お試しください。
  SASO-MCP-A001:
    title: MCP ツールが見つかりません
    detail: 要求された MCP ツールは登録されていないか、管理者によって無効化されています。
  SASO-MCP-A002:
    title: MCP リクエストの形式が不正です
    detail: JSON-RPC 2.0 エンベロープが無効です。"jsonrpc"・"method"・"id" フィールドを含む正しい JSON が送信されているか確認してください。
  SASO-MCP-A003:
    title: MCP ツールに必要なスコープがありません
    detail: このMCPツールを呼び出すには、デバイストークンに必要なスコープが付与されていません。必要なスコープを持つデバイストークンで再ペアリングしてください。
  SASO-PLUGIN-B001:
    title: プラグインがコア予約名への登録を試みました
    detail: プラグインがコア SASO のために予約された名前で拡張を登録しようとしました。プラグインは "vendor:custom-llm" のようにベンダー接頭辞付きの名前を使用してください。
  SASO-INFRA-9000:
    title: サーバー内部エラー
    detail: '想定外のエラーが発生しました。お問い合わせの際は次の参照 ID をお伝えください: {traceId}'
  SASO-INFRA-9001:
    title: データベースに接続できません
    detail: 現在データベースに接続できません。しばらく時間をおいて再度お試しください。
  SASO-INFRA-9002:
    title: ストレージに接続できません
    detail: 必要なストレージパスに現在アクセスできません。
  SASO-INFRA-9003:
    title: エンドポイントが見つかりません
    detail: 要求されたエンドポイントは存在しません。
  SASO-INFRA-9004:
    title: 許可されていないメソッドです
    detail: このエンドポイントでは要求された HTTP メソッドはサポートされていません。
