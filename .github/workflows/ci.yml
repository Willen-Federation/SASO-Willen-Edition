name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP syntax check (php -l)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Lint changed/all PHP files (excluding vendor and bundled libraries)
        run: |
          set -euo pipefail
          # Exclude vendor/, node_modules/, and the bundled TCPDF tree (tested upstream).
          mapfile -t files < <(find . \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -path './extention/TCPDF' -prune -o \
            -name '*.php' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} PHP files…"
          fail=0
          for f in "${files[@]}"; do
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done
          exit "$fail"

  json-validate:
    name: Validate JSON config files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          set -euo pipefail
          for f in config.json request.json flow.json; do
            if [ -f "$f" ]; then
              echo "Validating $f"
              python3 -c "import json,sys; json.load(open('$f'))"
            fi
          done

  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: composer validate (strict)
        run: composer validate --strict --no-check-publish

      - name: composer install (lock-consistency check)
        # Verifies composer.lock matches composer.json; this also covers
        # roave/security-advisories which fails install when a known-vulnerable
        # version of any dependency is required.
        run: composer install --dry-run --no-interaction --no-progress

  cs-check:
    name: PHP-CS-Fixer (PSR-12 + project rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP-CS-Fixer (dry run, fails on diff)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none --no-interaction

  static-analysis:
    name: PHPStan (level 6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        # 512M memory limit: the OpenAPI/fast-route + symfony/translation
        # graph crosses PHPStan 1.12's default 128M ceiling on the
        # GitHub-hosted runner. Bumping at the CLI keeps the local default
        # untouched.
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M

  unit-tests:
    name: PHPUnit (unit suite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: pdo_mysql, mbstring, gd, zip, intl, fileinfo, json, session
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit (Unit suite)
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage --display-warnings --display-deprecations

  # NOTE: Markdown link checking has been moved to milestone M2 where it will
  # run as part of the MkDocs build (`mkdocs build --strict` plus the
  # `mkdocs-linkcheck` plugin), against a curated `docs/` tree rather than the
  # whole repository. The previous gaurav-nelson/github-action-markdown-link-check
  # job was removed in PR #6 because it scanned the bundled extention/TCPDF
  # README and emitted persistent false positives for upstream URLs that
  # respond 403 to automated checkers (e.g. www.gnu.org).
